<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadFlow AI — Marketplace Suite</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="merge-shell">
    <nav class="tool-switch-holder" aria-label="Tool selector">
      <div class="tool-switch" role="tablist">
        <button id="switch-af" class="tool-choice active" type="button" role="tab" aria-selected="true" data-tool="af">AUTOFILL</button>
        <button id="switch-mm" class="tool-choice" type="button" role="tab" aria-selected="false" data-tool="mm">MULTIPLE</button>
        <button id="switch-automation" class="tool-choice" type="button" role="tab" aria-selected="false" data-tool="automation">AUTOMATION</button>
        <button id="switch-ai" class="tool-choice ai-tab-btn" type="button" role="tab" aria-selected="false" data-tool="ai">⚡ AI & CONFIG</button>
      </div>
    </nav>

    <div class="developer-credit">
      <div class="developer-credit-text">LEADFLOW AI • ENTERPRISE ANTI-DETECT SUITE v2.5</div>
      <div class="developer-neon-line" aria-hidden="true">
        <span class="neon-runner neon-runner-a"></span>
      </div>
    </div>

    <section class="tabs-content">
      <div id="wrapper-af" class="frame-wrapper" role="tabpanel">
        <iframe id="afFrame" title="Autofill Tool" data-src="shared/af/popup.html"></iframe>
      </div>
      <div id="wrapper-mm" class="frame-wrapper hidden" role="tabpanel">
        <iframe id="mmFrame" title="Multiple Buttons Tool" data-src="shared/mm/popup.html"></iframe>
      </div>
      <div id="wrapper-automation" class="frame-wrapper hidden" role="tabpanel">
        <iframe id="automationFrame" title="Automation Tool" data-src="shared/automation/popup.html"></iframe>
      </div>
      <div id="wrapper-ai" class="frame-wrapper hidden ai-settings-scroll" role="tabpanel">
        <div class="ai-panel">

          <!-- AI Provider & Key Card -->
          <div class="ai-card">
            <div class="ai-card-header">
              <span class="ai-title">🧠 Universal AI Engine (BYOK)</span>
              <span id="aiDetectedBadge" class="ai-badge">No Key</span>
            </div>
            <p class="ai-subtext">Paste any key (Gemini, Groq, OpenAI, Claude, OpenRouter, DeepSeek). Auto-detected instantly.</p>
            <div class="key-input-wrap">
              <input id="aiApiKey" type="password" class="ai-input" placeholder="Paste API Key (AIza..., gsk_..., sk-..., sk-ant-...)" />
              <button type="button" id="toggleKeyVisibility" class="key-toggle-btn" title="Show/Hide Key">👁️</button>
            </div>

            <div class="ai-grid-2">
              <div>
                <label class="ai-label" for="aiProvider">Provider</label>
                <select id="aiProvider" class="ai-select">
                  <option value="auto">✨ Auto-Detect Provider</option>
                  <option value="gemini">🤖 Google Gemini (Free Tier)</option>
                  <option value="groq">⚡ Groq Cloud (Ultra-Fast)</option>
                  <option value="openai">🧠 OpenAI (GPT-4o mini)</option>
                  <option value="anthropic">🔮 Anthropic Claude</option>
                  <option value="openrouter">🌐 OpenRouter (200+ Models)</option>
                  <option value="deepseek">👁️ DeepSeek</option>
                  <option value="nvidia">🟩 NVIDIA NIM</option>
                </select>
              </div>
              <div>
                <div class="model-header-row">
                  <label class="ai-label" for="aiModelSelect">Active Model</label>
                  <button type="button" id="fetchModelsBtn" class="link-btn" title="Refresh live models from API">🔄 Refresh</button>
                </div>
                <select id="aiModelSelect" class="ai-select">
                  <option value="auto">✨ Auto Select Optimal</option>
                </select>
                <input id="aiModel" type="text" class="ai-input hidden" placeholder="Custom Model ID" />
              </div>
            </div>

            <!-- Niche & Quick Chips -->
            <label class="ai-label" for="aiServiceNiche">Service Niche / Business Category</label>
            <input id="aiServiceNiche" type="text" class="ai-input" placeholder="e.g. 24/7 Emergency Plumber, HVAC Repair, Appliance Repair" />

            <div class="niche-chips" id="nicheChips">
              <button type="button" class="niche-chip" data-niche="24/7 Emergency Plumber">🔧 Plumbing</button>
              <button type="button" class="niche-chip" data-niche="HVAC Repair & AC Installation">❄️ HVAC</button>
              <button type="button" class="niche-chip" data-niche="Appliance Repair Service">🧺 Appliances</button>
              <button type="button" class="niche-chip" data-niche="Auto Repair & Mobile Mechanic">🚗 Auto</button>
              <button type="button" class="niche-chip" data-niche="Licensed Electrician Services">⚡ Electrical</button>
              <button type="button" class="niche-chip" data-niche="Roofing Repair & Replacement">🏠 Roofing</button>
            </div>

            <!-- Copywriting Tone & Options -->
            <div class="ai-grid-2">
              <div>
                <label class="ai-label" for="aiTone">Copywriting Tone</label>
                <select id="aiTone" class="ai-select">
                  <option value="urgent">⚡ Urgent Call-to-Action</option>
                  <option value="professional">🏆 Professional & Insured</option>
                  <option value="bargain">🏷️ Flat-Rate Deals</option>
                </select>
              </div>
              <div class="toggle-col">
                <label class="ai-toggle-row">
                  <span>Smart Emojis</span>
                  <input id="aiEmojis" type="checkbox" class="ai-checkbox" checked />
                </label>
              </div>
            </div>

            <label class="ai-toggle-row">
              <span>Unique Title & Desc Per Tab</span>
              <input id="aiUniquePerTab" type="checkbox" class="ai-checkbox" checked />
            </label>

            <label class="ai-toggle-row activate-row">
              <span class="activate-label">🚀 Activate AI Engine</span>
              <input id="aiEnabled" type="checkbox" class="ai-checkbox" />
            </label>
          </div>

          <!-- Speed & Anti-Ban Settings -->
          <div class="ai-card">
            <div class="ai-card-header">
              <span class="ai-title">🛡️ Anti-Detect & Speed Profile</span>
            </div>
            <label class="ai-label" for="humanModeSelect">Automation Speed Mode</label>
            <select id="humanModeSelect" class="ai-select">
              <option value="balanced">⚖️ Balanced (Safe & Fast)</option>
              <option value="turbo">⚡ Turbo Blitz (Ultra-Fast)</option>
              <option value="safe">🛡️ Stealth Human (Random Jitter)</option>
            </select>
            <label class="ai-label" for="telemetryWebhookUrl">Error Webhook URL (Optional Cloudflare Worker)</label>
            <input id="telemetryWebhookUrl" type="url" class="ai-input" placeholder="https://your-worker.workers.dev/report" />
          </div>

          <!-- Actions: Test & Save -->
          <div class="ai-actions">
            <button id="testAiBtn" type="button" class="ai-btn ai-btn-secondary">🧪 Test Connection</button>
            <button id="saveAiConfigBtn" type="button" class="ai-btn ai-btn-primary">💾 Save Settings</button>
          </div>

          <!-- Live Diagnostic Result Box -->
          <div id="aiDiagnosticBox" class="ai-diagnostic-box hidden">
            <div class="diagnostic-header">
              <span id="diagnosticTitle">Diagnostic Result</span>
              <span id="diagnosticLatency" class="latency-badge">0ms</span>
            </div>
            <div id="diagnosticPreview" class="diagnostic-preview"></div>
          </div>

          <div id="aiStatusMsg" class="ai-status"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
